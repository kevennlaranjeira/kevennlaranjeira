name: Tic-tac-toe

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: tictactoe
  cancel-in-progress: false

jobs:
  play:
    # Any queued run processes every open "ttt|" issue, so a skipped run loses nothing
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'ttt|')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Play pending moves
        run: python scripts/tictactoe.py play --outbox "$RUNNER_TEMP/outbox.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit board
        run: |
          if [[ -z "$(git status --porcelain README.md README.en.md game)" ]]; then
            echo "Board is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.en.md game
          git commit -m "Update tic-tac-toe board"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      # Runs only after the push worked; otherwise the issues stay open for the next run
      - name: Reply on issues
        run: python scripts/tictactoe.py notify --outbox "$RUNNER_TEMP/outbox.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
