name: Update profile README

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/profile-config.json"
      - "scripts/update_profile.py"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update generated README sections
        run: python scripts/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          if [[ -z "$(git status --porcelain README.md)" ]]; then
            echo "README.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update generated profile sections"
          git push
