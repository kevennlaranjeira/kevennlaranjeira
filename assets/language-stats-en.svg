      <stop offset="1" stop-color="#58a6ff" />
    </linearGradient>
    <style>@font-face{font-family:'Martian Mono';font-weight:400 700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Unbounded';font-weight:700 700;src:url(data:font/woff2;base64,) format('woff2');}
      .title { font: 700 24px 'Unbounded', 'Segoe UI', Ubuntu, sans-serif; fill: #e6edf3; }
      .subtitle { font: 400 12px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
      .lang { font: 700 13px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #e6edf3; }
      .percent { font: 700 13px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #e6edf3; }
      .muted { font: 400 11px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
      .metric-label { font: 400 11px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
      .metric-value { font: 700 15px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #e6edf3; }
      .metric-accent { font: 700 22px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #f0b429; }
      .footer { font: 400 11px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #6e7681; }</style>
