<svg width="920" height="370" viewBox="0 0 920 370" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Linguagens nos repositórios</title>
  <desc id="desc">Métricas atualizadas automaticamente pela GitHub API</desc>
  <defs>
