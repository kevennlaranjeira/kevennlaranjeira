      .desc { font: 400 12px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #c9d1d9; }
      .legend { font: 400 11px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
      .stars { font: 700 11px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #f0b429; }</style>
