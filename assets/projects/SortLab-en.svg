<svg width="500" height="214" viewBox="0 0 500 214" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SortLab: C lab that generates inputs, runs nine sorting algorithms and records the output and running time of each one.">
  <title>SortLab: C lab that generates inputs, runs nine sorting algorithms and records the output and running time of each one.</title>
  <defs>
    <pattern id="p-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#1c232d" />
    </pattern>
    <pattern id="p-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.018" />
    </pattern>
    <clipPath id="p-bar"><rect x="28" y="164" width="444" height="8" rx="4"><animate attributeName="width" values="0;0;444" keyTimes="0;0.185;1" dur="1.35s" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1" /></rect></clipPath>
    <style>@font-face{font-family:'Martian Mono';font-weight:400 700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Unbounded';font-weight:700 700;src:url(data:font/woff2;base64,) format('woff2');}
      .owner { font: 400 11px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
      .name { font: 700 19px 'Unbounded', 'Segoe UI', Ubuntu, sans-serif; fill: #e6edf3; }
      .updated { font: 400 10px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #6e7681; }
      .desc { font: 400 12px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #c9d1d9; }
      .legend { font: 400 11px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
      .stars { font: 700 11px 'Martian Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #f0b429; }</style>
  </defs>
  <rect width="500" height="214" rx="14" fill="#0b0f14" />
  <rect width="500" height="214" rx="14" fill="url(#p-dots)" />
  <rect width="500" height="214" rx="14" fill="url(#p-scan)" />
  <rect x="0.5" y="0.5" width="499" height="213" rx="14" stroke="#21262d" />
  <text x="28" y="38" class="owner">kevennlaranjeira /</text>
  <text x="472" y="38" class="updated" text-anchor="end">updated 09/06/2026</text>
  <text x="28" y="68" class="name">SortLab</text>
  <text x="28" y="104" class="desc">C lab that generates inputs, runs nine sorting</text>
  <text x="28" y="124" class="desc">algorithms and records the output and running</text>
  <text x="28" y="144" class="desc">time of each one.</text>
  <rect x="28" y="164" width="444" height="8" rx="4" fill="#1c232d" />
  <g clip-path="url(#p-bar)"><rect x="28.0" y="164" width="438.7" height="8" fill="#555555" /><rect x="466.2" y="164" width="6.3" height="8" fill="#427819" /></g>
  <circle cx="32" cy="192" r="4" fill="#555555" /><text x="42" y="196" class="legend">C 99%</text><circle cx="102.5" cy="192" r="4" fill="#427819" /><text x="112.5" y="196" class="legend">Makefile 1%</text>
  <text x="472" y="196" class="stars" text-anchor="end"></text>
</svg>
